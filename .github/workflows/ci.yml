name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q src scripts analysis
      - run: sha256sum -c DATA_SHA256SUMS
      - name: Reject legacy notebooks
        run: |
          if git ls-files | grep -E '(^|/)legacy/|\.ipynb$'; then
            echo "Legacy notebooks are not allowed in the public release."
            exit 1
          fi

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnuplot-nox fonts-liberation
      - run: bash scripts/render_paper_figures.sh
