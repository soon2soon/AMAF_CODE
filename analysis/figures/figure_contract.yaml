# ======================================================================
# Figure contracts
# ======================================================================

figures:

  # --------------------------------------------------------------------
  # Lunar main
  #
  # Central interpretation:
  # Naive adaptive specialization can introduce severe seed-dependent
  # late-stage failures. Protected AMAF mitigates these failures and
  # restores performance close to the stable Uniform reference on average.
  #
  # This figure MUST NOT be framed as Protected uniformly outperforming
  # Uniform or Naive across seeds.
  # --------------------------------------------------------------------

  lunar_main:
    figure_id: LUNAR_MAIN
    group: main
    status: active
    domain: lunar

    builder: analysis.figures.lunar:build_lunar_main

    title: >
      Failure mitigation while preserving reference-level performance

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: learning_curve

        sources:
          - lunar_primary_frozen

        metrics:
          - lunar.final

        pairing: none

        aggregation: >
          Evaluation episodes are first averaged within each checkpoint
          and seed. Seed-level checkpoint means are then aggregated across
          the 10 matched seeds.

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        smoothing: false

        message: >
          Show overall learning dynamics and reveal whether adaptive
          variants exhibit unstable or collapsing late-stage behavior.

        caveats:
          - >
            Evaluation episodes must never be treated as independent
            statistical samples.
          - >
            No smoothing beyond checkpoint-level aggregation is allowed.
          - >
            The figure must not imply that one method dominates every metric.


      B:
        status: active
        kind: seed_distribution

        sources:
          - lunar_per_seed

        metrics:
          - lunar.last5

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show absolute late-stage performance across all seeds. The panel
          should make the heavy negative tail of Naive adaptation visible
          rather than hiding it behind a group mean.

        visual_requirements:
          raw_seed_points: required
          group_mean: required
          confidence_interval: required

        caveats:
          - >
            All 10 seeds must be shown.
          - >
            Severe Naive failures must not be removed as outliers.
          - >
            Protected should be interpreted relative to both Naive and
            the stable Uniform reference.


      C:
        status: active
        kind: paired_rescue

        sources:
          - lunar_per_seed

        metrics:
          - lunar.last5

        pairing: within_seed

        focal_method: Protected
        comparator_method: Naive
        reference_method: Uniform

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show seed-wise Naive-to-Protected change across all matched seeds.
          The purpose is to identify failure mitigation: Protected strongly
          rescues a subset of catastrophic Naive failures while producing
          smaller or mixed changes on already-stable seeds.

        visual_requirements:
          show_all_pairs: true
          show_pair_ids: true
          show_reference_level: true
          zero_reference_if_delta_view: true

        derived_annotations:
          gap_recovery_pct:
            status: descriptive_only
            definition: >
              Group-mean recovery of the Uniform-minus-Naive gap by
              Protected. This quantity may be annotated descriptively but
              must not be presented as an inferential effect size.

        caveats:
          - >
            Failure seeds must not be selected or filtered post hoc;
            all matched seeds must be displayed.
          - >
            Mean and median paired effects should both be available because
            the effect distribution is strongly asymmetric.
          - >
            A large mean rescue effect must not be described as uniform
            seed-wise improvement.


      D:
        status: active
        kind: seed_distribution

        sources:
          - lunar_per_seed

        metrics:
          - lunar.retention_pct

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show preservation of best-observed performance. Protected is
          expected to remain close to the Uniform reference on average,
          while Naive exhibits severe retention failures in some seeds.

        visual_requirements:
          raw_seed_points: required
          group_mean: required
          confidence_interval: required

        caveats:
          - >
            Retention must always be interpreted jointly with absolute
            performance.
          - >
            Protected-versus-Naive retention improvement is not uniformly
            positive across seeds.
          - >
            Protected-versus-Uniform retention should be interpreted as
            approximate reference-level preservation rather than superiority.


  # --------------------------------------------------------------------
  # Lunar supplementary paired effects
  # --------------------------------------------------------------------

  lunar_paired_effects:
    figure_id: LUNAR_SUPP_EFFECTS
    group: supplementary
    status: active
    domain: lunar

    builder: analysis.figures.lunar:build_lunar_paired_effects

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: paired_delta

        sources:
          - lunar_paired_deltas

        metrics:
          - lunar.final
          - lunar.last5
          - lunar.auc
          - lunar.best5

        pairing: within_seed

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Report Protected-minus-comparator paired performance effects,
          preserving both effect magnitude and seed-level heterogeneity.

        caveats:
          - >
            Protected must not be described as uniformly superior when the
            paired win count does not support that interpretation.


      B:
        status: active
        kind: paired_delta

        sources:
          - lunar_paired_deltas

        metrics:
          - lunar.retention_pct

        pairing: within_seed

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Report retention effects separately because the unit is percentage
          points and the paired distribution is strongly asymmetric.


  # --------------------------------------------------------------------
  # Lunar supplementary failure anatomy
  # --------------------------------------------------------------------

  lunar_failure_modes:
    figure_id: LUNAR_SUPP_FAILURE_MODES
    group: supplementary
    status: active
    domain: lunar

    builder: analysis.figures.lunar:build_lunar_failure_modes

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: paired_rescue

        sources:
          - lunar_per_seed

        metrics:
          - lunar.last5

        pairing: within_seed

        focal_method: Protected
        comparator_method: Naive
        reference_method: Uniform

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Expose the complete seed-level anatomy of Naive late-stage failures
          and the extent to which Protected rescues each matched seed.

        caveats:
          - >
            Every seed must remain visible, including seeds where Protected
            performs worse than Naive.


      B:
        status: active
        kind: paired_rescue

        sources:
          - lunar_per_seed

        metrics:
          - lunar.retention_pct

        pairing: within_seed

        focal_method: Protected
        comparator_method: Naive
        reference_method: Uniform

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show the seed-level retention failure distribution and distinguish
          catastrophic-failure mitigation from uniform improvement.

  # --------------------------------------------------------------------
  # Crop main
  # --------------------------------------------------------------------

  crop_main:
    figure_id: CROP_MAIN
    group: main
    status: active
    domain: crop

    builder: analysis.figures.crop:build_crop_main

    title: >
      Training dynamics and resource-yield trade-offs

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: training_progress

        sources:
          - crop_baseline_primary_frozen
          - crop_anchored_primary_frozen
          - crop_per_seed

        metrics:
          - crop.block100_return

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show the full 3000-episode learning trajectory and a clearly marked
          late-stage absolute-performance zoom without hiding the terminal
          Uniform crossover.


      B:
        status: active
        kind: seed_resource_yield_delta

        sources:
          - crop_per_seed
          - crop_resource_paired

        metrics:
          - crop.N100
          - crop.irr100
          - crop.yield100

        pairing: within_seed

        display_transform:
          crop.N100: "Uniform - Anchored"
          crop.irr100: "Uniform - Anchored"
          crop.yield100: "Anchored - Uniform"

        display_direction: >
          Positive values indicate a benefit for Anchored.

        message: >
          Show matched-seed nitrogen and irrigation savings together with the
          corresponding yield change.

        caveats:
          - >
            Resource savings must not be presented without yield outcomes.


      C:
        status: active
        kind: aligned_outcome_profile

        sources:
          - crop_per_seed

        metrics:
          - crop.N100
          - crop.irr100
          - crop.yield100

        pairing: none

        uncertainty:
          method: descriptive

        message: >
          Show five raw seed observations and the method mean in aligned Yield,
          Nitrogen, and Irrigation columns, preserving a fixed method row order.

        caveats:
          - >
            Yield is higher-is-better; nitrogen and irrigation are
            lower-is-better. Every column must use its native unnormalized unit.
          - >
            Method rows must remain DQN, Dueling, Uniform, Naive, Anchored from
            top to bottom, and no seed observation may be omitted.


  # --------------------------------------------------------------------
  # Crop reviewer performance decomposition
  # --------------------------------------------------------------------

  crop_reviewer_performance:
    figure_id: CROP_REVIEWER_PERFORMANCE
    group: supplementary
    status: active
    domain: crop

    builder: analysis.figures.crop:build_crop_reviewer_performance

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: training_progress_overview

        sources:
          - crop_baseline_primary_frozen
          - crop_anchored_primary_frozen
          - crop_per_seed

        metrics:
          - crop.block100_return

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Preserve the complete absolute-return trajectory for all five methods.


      B:
        status: active
        kind: post_catastrophic_absolute_progress

        sources:
          - crop_baseline_primary_frozen
          - crop_anchored_primary_frozen
          - crop_per_seed

        metrics:
          - crop.block100_return

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show absolute returns from the fixed Episode 1501 phase boundary,
          after every aggregate method has exited the catastrophic negative phase.


      C:
        status: active
        kind: aligned_outcome_profile

        sources:
          - crop_baseline_primary_frozen
          - crop_anchored_primary_frozen
          - crop_per_seed

        metrics:
          - crop.N100
          - crop.irr100
          - crop.yield100

        pairing: none

        uncertainty:
          method: descriptive

        message: >
          Complete the reviewer performance view with five raw seed observations
          and the method mean in aligned Yield, Nitrogen, and Irrigation columns.

        caveats:
          - >
            Yield is higher-is-better; nitrogen and irrigation are
            lower-is-better. Every column must use its native unnormalized unit.
          - >
            Method rows must remain DQN, Dueling, Uniform, Naive, Anchored from
            top to bottom, and no seed observation may be omitted.


  # --------------------------------------------------------------------
  # Crop per-seed performance evidence
  # --------------------------------------------------------------------

  crop_per_seed_performance:
    figure_id: CROP_SUPP_PER_SEED
    group: supplementary
    status: active
    domain: crop

    builder: analysis.figures.crop:build_crop_per_seed_performance

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: seed_training_progress

        sources:
          - crop_baseline_primary_frozen
          - crop_anchored_primary_frozen
          - crop_per_seed

        metrics:
          - crop.block100_return
          - crop.late1000
          - crop.final100

        pairing: none

        uncertainty:
          method: descriptive

        message: >
          Show the complete 3000-episode trajectory and late-stage behavior
          separately for every primary Crop seed, using a common axis convention
          so that individual runs can be compared directly.

        caveats:
          - >
            All five seeds and all five methods must be shown; seeds may not be
            selected according to outcome.
          - >
            Across-seed bootstrap intervals must not be displayed as uncertainty
            for a single-seed trajectory.
          - >
            Full and late-stage axis ranges must be identical across seed figures.


