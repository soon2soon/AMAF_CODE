schema_version: 1
contract_version: "2026-09-10-v4"

project:
  name: AMAF
  purpose: >
    Canonical analysis and figure contract for manuscript revision.
    Every manuscript figure must be traceable to canonical or frozen evidence,
    use seed-level statistical units, and preserve paired experimental structure
    whenever applicable.


# ======================================================================
# Vocabulary
# ======================================================================

vocabulary:

  figure_groups:
    - main
    - supplementary
    - draft_live

  statuses:
    - active
    - planned
    - draft
    - blocked
    - retired

  dataset_kinds:
    - canonical_csv
    - frozen_dir
    - analysis_csv
    - live_output

  dataset_lifecycles:
    - canonical
    - frozen
    - planned
    - live
    - retired

  uncertainty_methods:
    - bootstrap_mean
    - paired_bootstrap_mean
    - standard_deviation
    - none
    - descriptive

  pairings:
    - none
    - within_seed

  directions:
    - higher
    - lower
    - descriptive
    - mixed


# ======================================================================
# Global policy
# ======================================================================

global_policy:

  experimental_unit_default: seed

  uncertainty_default:
    method: bootstrap_mean
    confidence: 0.95
    resamples: 100000
    rng_seed: 20260907

  paired_uncertainty_default:
    method: paired_bootstrap_mean
    confidence: 0.95
    resamples: 100000
    rng_seed: 20260907

  manuscript:

    allowed_groups:
      - main
      - supplementary

    forbidden_dataset_kinds:
      - live_output

    forbidden_dataset_lifecycles:
      - planned
      - live
      - retired

    reject_incomplete_runs: true

  statistics:

    seed_is_primary_experimental_unit: true

    eval_episodes_are_independent_samples: false

    crop_episodes_are_independent_samples: false

    preserve_pairing_when_available: true

    report_raw_seed_observations_when_feasible: true

    report_wins_for_paired_comparisons: true

    avoid_p_value_as_primary_visual_evidence: true

  rendering:

    output_formats:
      - pdf
      - png
      - csv
      - json

    png_dpi: 400
    pdf_fonttype: 42

    use_consistent_method_encoding: true

    distinguish_methods_by:
      - color
      - marker
      - linestyle

    prohibit_misleading_axis_truncation: true
    show_zero_reference_for_delta_plots: true

    smoothing:
      default: false
      require_explicit_contract: true


# ======================================================================
# Metric definitions
# ======================================================================

metrics:

  # --------------------------------------------------------------------
  # Lunar
  # --------------------------------------------------------------------

  lunar.final:
    domain: lunar
    unit: evaluation_return
    direction: higher
    definition: >
      Mean return at the final evaluation checkpoint at or before
      500,000 environment steps.

  lunar.last5:
    domain: lunar
    unit: evaluation_return
    direction: higher
    definition: >
      Mean of the final five evaluation-checkpoint mean returns.

  lunar.auc:
    domain: lunar
    unit: normalized_return_auc
    direction: higher
    definition: >
      Normalized trapezoidal area under the evaluation learning curve
      using checkpoint mean returns.

  lunar.best5:
    domain: lunar
    unit: evaluation_return
    direction: higher
    definition: >
      Mean of the five highest evaluation-checkpoint mean returns.

  lunar.retention_pct:
    domain: lunar
    unit: percent
    direction: higher
    definition: >
      100 times Last-5 performance divided by Best-5 performance.

  lunar.final_gt_200:
    domain: lunar
    unit: binary
    direction: higher
    definition: >
      Indicator that final evaluation return exceeds 200.


  # --------------------------------------------------------------------
  # Crop
  # --------------------------------------------------------------------

  crop.full:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over episodes 1 through 3000.

  crop.block100_return:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return within each non-overlapping block of 100 episodes.
      Blocks are computed within each seed before across-seed aggregation;
      the progress coordinate is the one-based final episode of each block.

  crop.early500:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over the first 500 episodes.

  crop.early1000:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over episodes 1 through 1000.

  crop.mid1000:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over episodes 1001 through 2000.

  crop.late1000:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over episodes 2001 through 3000.

  crop.final500:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over the final 500 episodes.

  crop.final250:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over the final 250 episodes.

  crop.final100:
    domain: crop
    unit: train_return
    direction: higher
    definition: >
      Mean training return over the final 100 episodes.

  crop.yield100:
    domain: crop
    unit: yield
    direction: higher
    definition: >
      Mean crop yield over the final 100 episodes.

  crop.N100:
    domain: crop
    unit: nitrogen
    direction: lower
    definition: >
      Mean nitrogen usage over the final 100 episodes.

  crop.irr100:
    domain: crop
    unit: irrigation
    direction: lower
    definition: >
      Mean irrigation usage over the final 100 episodes.

  crop.T800:
    domain: crop
    unit: episode
    direction: lower
    definition: >
      First episode at which rolling-100 return reaches 800.

  crop.T900:
    domain: crop
    unit: episode
    direction: lower
    definition: >
      First episode at which rolling-100 return reaches 900.

  crop.T1000:
    domain: crop
    unit: episode
    direction: lower
    definition: >
      First episode at which rolling-100 return reaches 1000.


  # --------------------------------------------------------------------
  # HalfCheetah
  # --------------------------------------------------------------------

  halfcheetah.at_1m:
    domain: halfcheetah
    unit: evaluation_return
    direction: higher
    definition: >
      Mean evaluation return at exactly 1,000,000 environment steps.

  halfcheetah.at_1p5m:
    domain: halfcheetah
    unit: evaluation_return
    direction: higher
    definition: >
      Mean evaluation return at exactly 1,500,000 environment steps.

  halfcheetah.gain_1m_to_1p5m:
    domain: halfcheetah
    unit: evaluation_return_change
    direction: higher
    definition: >
      Evaluation return at 1.5M minus evaluation return at 1.0M.

  halfcheetah.last5:
    domain: halfcheetah
    unit: evaluation_return
    direction: higher
    definition: >
      Mean of the final five evaluation checkpoint means.

  halfcheetah.last10:
    domain: halfcheetah
    unit: evaluation_return
    direction: higher
    definition: >
      Mean of the final ten evaluation checkpoint means.

  halfcheetah.auc_1p5m:
    domain: halfcheetah
    unit: normalized_return_auc
    direction: higher
    definition: >
      Normalized trapezoidal area under the evaluation curve through 1.5M.


