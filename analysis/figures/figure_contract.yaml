  # --------------------------------------------------------------------
  # HalfCheetah main
  # --------------------------------------------------------------------

  halfcheetah_main:
    figure_id: HALFCHEETAH_MAIN
    group: main
    status: active
    domain: halfcheetah

    builder: analysis.figures.halfcheetah:build_halfcheetah_main

    title: >
      Late-stage adaptive improvement in continuous control

    experimental_unit: seed

    panels:

      A:
        status: active
        kind: learning_curve

        sources:
          - halfcheetah_primary_frozen
          - halfcheetah_replication_frozen

        metrics:
          - halfcheetah.at_1p5m

        pairing: none

        uncertainty:
          method: bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        smoothing: false

        message: >
          Show TD3 and AMAF learning trajectories across the pooled
          10 matched seeds.


      B:
        status: active
        kind: paired_transition

        sources:
          - halfcheetah_per_seed

        metrics:
          - halfcheetah.at_1m
          - halfcheetah.at_1p5m

        pairing: within_seed

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Show the seed-level movement of AMAF minus TD3 from
          1.0M to 1.5M.

        caveats:
          - >
            The primary interpretation is late-stage relative improvement,
            not large terminal mean superiority.


      C:
        status: active
        kind: paired_delta

        sources:
          - halfcheetah_per_seed
          - halfcheetah_paired

        metrics:
          - halfcheetah.at_1p5m
          - halfcheetah.gain_1m_to_1p5m

        pairing: within_seed

        uncertainty:
          method: paired_bootstrap_mean
          confidence: 0.95
          resamples: 100000
          rng_seed: 20260907

        message: >
          Compare terminal paired effects with late-stage relative-gain
          effects.


