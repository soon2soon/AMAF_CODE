name: lunarlander_fixed500k_corrected

seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 111]

algorithms:
  - name: amaf_uniform
    config: ../../configs/lunarlander/amaf_uniform.yaml

  - name: amaf_dqn
    config: ../../configs/lunarlander/amaf_dqn.yaml

analysis:
  final_window: 100
  threshold: 200
  comparison_metric: final_window_mean
  comparison_pairs:
    - [amaf_dqn, amaf_uniform]
