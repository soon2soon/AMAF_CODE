schema_version: 1
inventory_version: "2026-09-07-v1"

project:
  name: AMAF
  purpose: >
    Master inventory of manuscript, supplementary, robustness,
    mechanism, reviewer-response, and diagnostic figures.

vocabulary:

  statuses:
    - active
    - planned
    - blocked
    - draft_live
    - retired

  roles:
    - main
    - supplementary
    - robustness
    - mechanism
    - reviewer_response
    - diagnostic
    - conceptual

  priorities:
    - P0
    - P1
    - P2
    - P3

  readiness:
    - ready
    - derivable
    - verify_data
    - live
    - blocked


figures:

  # ====================================================================
  # CONCEPT / ARCHITECTURE
  # ====================================================================

  amaf_architecture:
    figure_id: CONCEPT_AMAF_ARCHITECTURE
    domain: concept
    role: conceptual
    manuscript_target: main
    status: planned
    priority: P0
    readiness: ready
    contract_key: null
    requires_new_experiment: false
    title: >
      AMAF architecture: reference-preserving adaptive specialization
    purpose: >
      Explain multiple advantage specialists, the stable reference path,
      and state-conditioned adaptive fusion.

  reference_specialization_concept:
    figure_id: CONCEPT_REFERENCE_SPECIALIZATION
    domain: concept
    role: conceptual
    manuscript_target: main
    status: planned
    priority: P1
    readiness: ready
    contract_key: null
    requires_new_experiment: false
    title: >
      Why adaptive specialization needs a protected reference
    purpose: >
      Intuitively contrast stable reference behavior, naive adaptation,
      and protected specialization.


